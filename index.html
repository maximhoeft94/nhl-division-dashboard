<style>
:root{
  --bg:#eef3f8; --panel:#ffffff; --ink:#0d1b2e; --muted:#5b6c82; --line:#d6dfea; --soft:#f4f7fb;
  --blue:#1d5bbf; --red:#c8202f; --good:#0b8a4f; --bad:#c8202f;
  --div:#1d5bbf; --a:#1d5bbf; --b:#e8590c;
  --font-d:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --font-b:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--div);outline-offset:2px}
.mono,.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.brand{font-family:var(--font-d);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand small{font-family:var(--font-b);font-weight:500;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:0}
.banner{background:color-mix(in srgb,var(--b) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--b) 55%,var(--line));border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:14px}

/* rink-line divider: red center line flanked by blue lines */
.tabs{display:flex;gap:0;border-bottom:3px solid var(--red);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:5px solid transparent;margin-bottom:-3px;padding:10px 20px 8px;font-family:var(--font-d);font-weight:600;font-size:22px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--c)}

/* hero */
.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 0 20px}
.mark{width:132px;height:132px;flex:none;margin-right:8px}
.mark .f{fill:none;stroke:var(--red);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.mark .b{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.mark .m{fill:none;stroke:var(--red);stroke-width:1.5;opacity:.4}
.hero h1{font-family:var(--font-d);font-weight:700;font-size:clamp(56px,10vw,104px);line-height:.88;margin:0;letter-spacing:-.005em}
.hero h1 span{display:block;font-size:.3em;font-weight:600;color:var(--muted);letter-spacing:.01em;margin-bottom:6px}
.hero .circle{position:relative}
.hero .circle::after{content:"";position:absolute;left:-14px;top:-4px;bottom:-4px;width:6px;background:var(--div);border-radius:3px}
.hero .circle h1{padding-left:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kl{font-size:13px;color:var(--muted)}
.kv{font-family:var(--font-d);font-weight:700;font-size:34px;line-height:1.05;margin-top:2px}
.ks{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}

/* sections */
section{margin-top:34px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:10px}
h2{font-family:var(--font-d);font-weight:700;font-size:30px;line-height:1;margin:0}
.note{font-size:13px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.scroll{overflow-x:auto}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-weight:600;font-size:13px;color:var(--muted);background:var(--soft);user-select:none}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--ink)}
th.on{color:var(--ink)}
th.on::after{content:attr(data-arrow);margin-left:3px;color:var(--div)}
tbody tr:last-child td{border-bottom:0}
tr.cut td{border-bottom:2px dashed var(--div)}
td.hl{font-weight:700;background:color-mix(in srgb,var(--div) 10%,transparent)}
.team{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.team .full{font-weight:500;color:var(--muted);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.W{color:var(--good);font-weight:700}.L{color:var(--bad);font-weight:700}.OTL{color:var(--muted);font-weight:700}
.rk{color:var(--muted);width:30px}

/* schedule */
.day{padding:10px 14px 4px}
.day+.day{border-top:1px solid var(--line)}
.dh{font-family:var(--font-d);font-weight:600;font-size:19px;margin-bottom:4px}
.dh span{font-family:var(--font-b);font-weight:400;font-size:13px;color:var(--muted);margin-left:8px}
.gm{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr) 90px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.gm:first-of-type{border-top:0}
.gm .tm{display:flex;align-items:center;gap:8px;font-weight:600}
.gm .tm.h{justify-content:flex-start}
.gm .rec{font-weight:400;font-size:12px;color:var(--muted)}
.gm .at{text-align:center;color:var(--muted);font-size:13px}
.gm .tt{text-align:right;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--div);border:1px solid var(--div);border-radius:4px;padding:0 5px;margin-left:6px}

/* leader cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{padding:14px 16px 10px}
.card h3{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0 0 8px}
.lr{display:grid;grid-template-columns:20px 62px minmax(0,1fr) 52px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.lr .r{color:var(--muted);font-size:12px}
.lr .tm{font-weight:600;display:flex;align-items:center;gap:6px}
.bar{height:10px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--div);border-radius:2px}
.lr .v{text-align:right;font-weight:600}

/* division charts */
.cr{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:8px;align-items:center;padding:4px 0;font-size:14px}
.cr .tm{font-weight:600;display:flex;align-items:center;gap:6px}
.cr .v{text-align:right;font-weight:600}
.trk{height:16px;background:var(--soft);border-radius:3px;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;height:100%}
.pair{display:grid;gap:3px}
.pair .trk{height:9px}
.dv{display:grid;grid-template-columns:1fr 1fr;height:16px;background:var(--soft);border-radius:3px;overflow:hidden}
.dv .l{display:flex;justify-content:flex-end;border-right:2px solid var(--line)}
.dv .r{display:flex}
.dv i{display:block;height:100%}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 6px}
.lgd b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.card.div{border-left:5px solid var(--c)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.g2{grid-template-columns:1fr}}
/* insights */
table.ins td,table.ins th{padding:8px 12px}
.fd{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:4px;background:var(--soft);border:1px solid var(--line);vertical-align:middle}
.fd.W{background:var(--good);border-color:var(--good)}.fd.L{background:var(--bad);border-color:var(--bad)}.fd.OTL{background:var(--muted);border-color:var(--muted)}
.bd{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 7px;color:#fff;white-space:nowrap}
.bd.in{background:var(--good)}.bd.wc{background:#c98a00}.bd.out{background:var(--muted)}
.sc{width:100%;height:auto;display:block}
.sc text{font-family:var(--font-b);font-size:12px;fill:var(--muted)}
.sc .lab{fill:var(--ink);font-weight:600}
.sc .gl{stroke:var(--line);stroke-width:1}.sc .avg{stroke:var(--muted);stroke-width:1.25;stroke-dasharray:5 4}
.sc .best{font-size:12px;fill:var(--div);font-weight:700}
.sc .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dvd tr.cur td{background:color-mix(in srgb,var(--div) 10%,transparent)}
.dvd td small{display:block;color:var(--muted);font-size:12px}
.ihead{padding:10px 14px 0}
.chd{font-size:12px;font-weight:600;color:var(--muted);padding:0 0 2px}
.cr4{grid-template-columns:62px minmax(0,1fr) 40px 40px}
.fdl{display:flex;justify-content:space-between;width:106px;font-size:11px;font-weight:500;margin-top:2px}
table.ins td .fd{margin-right:9px}table.ins td .fd:last-child{margin-right:0}
.sc .ax{stroke:var(--line);stroke-width:1.25}
.sc .bestc{fill:none;stroke:var(--div);stroke-width:1.75}
.card.wide .trk{height:20px}.card.wide .pair .trk{height:12px}.card.wide .pair{gap:4px}
/* pills */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.pill.on{background:var(--div);border-color:var(--div);color:#fff}
.pills .sep{width:1px;background:var(--line);margin:0 4px}

/* trend */
.trend{padding:10px 12px 12px}
.trend svg{width:100%;height:auto;display:block}
.trend text{font-family:var(--font-b);fill:var(--muted);font-size:11px}
.trend .grid-l{stroke:var(--line);stroke-width:1}
.trend .zero{stroke:var(--red);stroke-width:1.25;stroke-dasharray:4 3}
.trend .tl{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.95}
.trend:has(.tl:hover) .tl:not(:hover){opacity:.15}
.trend .tl:hover{stroke-width:3.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px}

/* head to head */
.h2h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.h2h .panel{padding:14px 16px}
.h2h h3{font-family:var(--font-d);font-weight:600;font-size:21px;margin:0 0 8px}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
select{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%;min-width:0;flex:1 1 150px}
.sel .ca{border-left:5px solid var(--a)}.sel .cb{border-left:5px solid var(--b)}
.radar{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .spoke{stroke:var(--line);stroke-width:1}
.radar text{font-family:var(--font-b);font-size:13px;fill:var(--ink)}
.radar .rpt{cursor:pointer}
.radar .rpt .hit{fill:transparent}
.radar .rpt .dotp{stroke:var(--panel);stroke-width:2;transition:stroke-width .1s}
.radar .rpt:hover .dotp{stroke:var(--ink);stroke-width:2.5}
.tip{position:fixed;left:0;top:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--a);border-radius:6px;padding:7px 11px;font-size:13px;line-height:1.35;box-shadow:0 4px 14px rgba(13,27,46,.16);white-space:nowrap}
.tip.on{opacity:1}
.tip.wrap{white-space:normal;max-width:280px}
.sc .rpt{cursor:pointer}
.sc .rpt .hit{fill:transparent}
.sc .rpt .dotp{stroke:var(--panel);stroke-width:2;transition:stroke-width .1s}
.sc .rpt:hover .dotp{stroke:var(--ink);stroke-width:2.5}
.tip span{display:block;color:var(--muted)}
.tip span b{color:var(--ink)}
.cmp td{padding:6px 8px}
.cmp td.k{text-align:center;color:var(--muted);font-size:13px}
.cmp td.win{font-weight:700;color:var(--ink)}
.cmp td:not(.win):not(.k){color:var(--muted)}
.cmp .a.win{box-shadow:inset 3px 0 0 var(--a)}
.cmp .b.win{box-shadow:inset -3px 0 0 var(--b)}
.cmp td.a{text-align:right}.cmp td.b{text-align:left}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:3px solid var(--blue);padding-top:12px}

@media (max-width:820px){
  .hero{padding-top:22px}
  .mark{width:84px;height:84px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-bottom:1px solid var(--line)}
  .kpi:nth-child(2n){border-right:0}
  .kpi:last-child{grid-column:1/-1;border-bottom:0;border-right:0}
  .h2h{grid-template-columns:1fr}
  .gm{grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr)}
  .gm .tt{grid-column:1/-1;text-align:left;padding-left:20px}
  .tag{display:none}
  .gm .rec{white-space:nowrap}
}
@media (prefers-reduced-motion:no-preference){
  .bar i{transition:width .35s ease}
}
</style>
</head>

</div>

const W_ = 'var(--good)', O_ = 'var(--muted)', L_ = 'var(--bad)';
function cCard(title, note, body, extra, wide){
  const st = (extra?'--c:'+DIVCOL[title]+';':'')+(wide?'grid-column:1/-1;':'');

const PTS_HEAD = '<div class="cr cr4 chd"><span></span><span></span><span class="v">PTS</span><span class="v">PPR</span></div>';

function rowOf(a, mid, val){ return '<div class="cr"><span class="tm">'+dot(a)+esc(a)+'</span>'+mid+'<span class="v num">'+val+'</span></div>'; }
// Snapshot order: points, then possible points remaining, then the default order
const cmpSnap = (a,b) => T[b].pts - T[a].pts || T[b].ppr - T[a].ppr || cmpStand(a,b);
function renderDivCharts(){

    });

  }

  h += cCard('Points', '', PTS_HEAD + ts.map(a => rowPts(a, '<span class="trk"><i style="width:'+(T[a].pts/maxP*100).toFixed(1)+'%;background:'+esc(T[a].color)+'"></i></span>')).join(''));
  h += cCard('Record', '', '<div class="lgd"><span><b style="background:'+W_+'"></b>Wins</span><span><b style="background:'+O_+'"></b>OT losses</span><span><b style="background:'+L_+'"></b>Losses</span></div>'
    + ts.map(a => { const t=T[a], seg=(n,c)=> n ? '<span class="seg" style="width:'+(n/maxGP*100).toFixed(1)+'%;background:'+c+'">'+n+'</span>' : '';
      return rowOf(a, '<span class="trk">'+seg(t.w,W_)+seg(t.otl,O_)+seg(t.l,L_)+'</span>', t.w+'-'+t.l+'-'+t.otl); }).join(''));

  h += cCard('Goal differential', '', ts.slice().sort((x,y)=>T[y].diff-T[x].diff).map(a => { const d=T[a].diff, w=(Math.abs(d)/maxD*100).toFixed(1);
      return rowOf(a, '<span class="dv"><span class="l">'+(d<0?'<i style="width:'+w+'%;background:var(--bad)"></i>':'')+'</span><span class="r">'+(d>0?'<i style="width:'+w+'%;background:var(--good)"></i>':'')+'</span></span>', sgn(d)); }).join(''), '', 1);

function niceTicks(min,max,n){
  const span = (max-min) || 1, raw = span/n, mag = Math.pow(10,Math.floor(Math.log10(raw))), f = raw/mag;
  const step = (f<1.5?1:f<3?2:f<7?5:10)*mag, out = [];
  for(let v=Math.ceil(min/step)*step; v<=max+1e-9; v+=step) out.push(+v.toFixed(6));
  return out;
}
const rec3 = L => { let w=0,l=0,o=0; L.forEach(g => { if(g.res==='W') w++; else if(g.res==='OTL') o++; else l++; }); return w+'-'+l+'-'+o; };

/* playoff picture: top 3 per division, then 2 wild cards per conference */
function playoffPicture(){
  const pic = {}, conf = {};
  ['Eastern','Western'].forEach(cn => {
    const teams = AB.filter(a=>T[a].conference===cn), divs = DIVS.filter(d=>teams.some(a=>T[a].division===d));
    const inSet = [], tag = {};
    divs.forEach(d => teams.filter(a=>T[a].division===d).sort(cmpStand).slice(0,3).forEach((a,i) => { tag[a] = d+' '+(i+1); inSet.push(a); }));
    const rest = teams.filter(a=>!tag[a]).sort(cmpStand);
    rest.slice(0,2).forEach((a,i) => { tag[a] = 'Wild card '+(i+1); inSet.push(a); });
    const outSet = rest.slice(2), lastIn = inSet.slice().sort(cmpStand).pop(), firstOut = outSet[0];
    teams.forEach(a => {
      const isIn = inSet.indexOf(a) >= 0;
      pic[a] = {isIn:isIn, wc:/^Wild/.test(tag[a]||''), label:isIn ? tag[a] : 'Out', gap: isIn ? T[a].pts - T[firstOut].pts : T[a].pts - T[lastIn].pts};
    });
    conf[cn] = {inSet:inSet.sort(cmpStand), wc:rest.slice(0,2), out:outSet, lastIn:lastIn, firstOut:firstOut};
  });
  return {pic:pic, conf:conf};
}

function scorersOf(a){

  const byG = ps.slice().sort((x,y)=>y.g-x.g||y.p-x.p||x.gp-y.gp||x.name.localeCompare(y.name))[0];
  return {complete:complete, byP:byP, byG:byG, goals:goals};

  });
  return h+'</tbody></table></div><div class="note" style="margin-top:6px">Shown only for teams whose player stats cover every game they have played. Share of team goals is the top goal scorer\'s goals divided by all goals scored by that team\'s skaters.</div>';

function tabDvd(){

    add(dh,da,g.hs,g.as,hw); add(da,dh,g.as,g.hs,!hw);
  });

function shotStats(a){

  const share = sf/(sf+sa), shp = t.gf/sf, svp = 1 - t.ga/sa;

/* ---------- radar ---------- */
function radar(labels, A, B, tipA, tipB){
  const W=540, H=452, cx=W/2, cy=H/2+2, R=150, n=labels.length;
  const pt = (i,v) => { const ang=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(ang)*R*v, cy+Math.sin(ang)*R*v]; };
  const poly = (arr) => arr.map((v,i)=>pt(i,v).map(x=>x.toFixed(1)).join(',')).join(' ');
  let s = '<svg class="radar" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Radar comparison">';
  [0.25,0.5,0.75,1].forEach(r => { s += '<polygon class="ring" points="'+poly(new Array(n).fill(r))+'"/>'; });
  for(let i=0;i<n;i++){ const p=pt(i,1); s += '<line class="spoke" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'; }
  s += '<polygon points="'+poly(A)+'" style="fill:var(--a);fill-opacity:.22;stroke:var(--a);stroke-width:2.5"/>';
  s += '<polygon points="'+poly(B)+'" style="fill:var(--b);fill-opacity:.22;stroke:var(--b);stroke-width:2.5"/>';
  const dots = (arr, tips, col) => !tips ? '' : arr.map((v,i) => { const p = pt(i,v), t = tips[i];
    return '<g class="rpt" data-n="'+esc(t[0])+'" data-m="'+esc(t[1])+'" data-v="'+esc(t[2])+'" data-c="'+col+'"><circle class="hit" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="13"/><circle class="dotp" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5" style="fill:'+col+'"/></g>'; }).join('');
  s += dots(A, tipA, 'var(--a)') + dots(B, tipB, 'var(--b)');
  labels.forEach((l,i) => {
    const p = pt(i,1.14), c = Math.cos(-Math.PI/2+i*2*Math.PI/n);
    s += '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="'+(Math.abs(c)<0.2?'middle':(c>0?'start':'end'))+'">'+esc(l)+'</text>';
  });
  return s+'</svg>';
}
function cmpTable(rows, nameA, nameB){
  let h = '<div class="scroll"><table class="cmp"><tbody>';
  rows.forEach(r => {
    const aw = r.a!==r.b && ((r.hi && r.a>r.b) || (!r.hi && r.a<r.b)), bw = r.a!==r.b && !aw;
    h += '<tr><td class="a'+(aw?' win':'')+' num">'+r.fa+'</td><td class="k">'+r.l+'</td><td class="b'+(bw?' win':'')+' num">'+r.fb+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

  const AX = RM.filter(m => played.some(a => ok(T[a][m.k])));
  const rng = {}; AX.forEach(m => { const xs = played.map(a=>T[a][m.k]).filter(ok); rng[m.k] = [Math.min.apply(null,xs), Math.max.apply(null,xs)]; });
  const nrm = (m,val) => { if(!ok(val)) return 0.06; const r=rng[m.k]; if(r[1]===r[0]) return 0.5; const f=(val-r[0])/(r[1]-r[0]); return 0.06+0.94*(m.hi?f:1-f); };
  let h = '<div class="sh"><h2>Head-to-head: teams</h2></div>'
    + '<div class="h2h"><div class="panel"><div class="sel"><select class="ca" data-sel="tA" aria-label="Team A">'+teamOpts(state.tA)+'</select><select class="cb" data-sel="tB" aria-label="Team B">'+teamOpts(state.tB)+'</select></div>';
  h += (played.length && AX.length>=3) ? radar(AX.map(m=>m.l), AX.map(m=>nrm(m,A[m.k])), AX.map(m=>nrm(m,B[m.k])), AX.map(m=>[A.name, m.l, fmtR(m,A[m.k])]), AX.map(m=>[B.name, m.l, fmtR(m,B[m.k])])) : '<div class="empty">The radar appears once games have been played.</div>';
  h += '</div><div class="panel"><h3><span style="color:var(--a)">'+esc(A.name)+'</span> vs <span style="color:var(--b)">'+esc(B.name)+'</span></h3>';
  const rows = [
    {l:'Record', a:A.pts, b:B.pts, hi:1, fa:A.w+'-'+A.l+'-'+A.otl, fb:B.w+'-'+B.l+'-'+B.otl},
    {l:'Points', a:A.pts, b:B.pts, hi:1, fa:A.pts, fb:B.pts},
    {l:'Goal differential', a:A.diff, b:B.diff, hi:1, fa:sgn(A.diff), fb:sgn(B.diff)},
    {l:'Last 10', a:(A.l10||'0-0-0').split('-')[0]*1, b:(B.l10||'0-0-0').split('-')[0]*1, hi:1, fa:A.l10||'–', fb:B.l10||'–'}
  ].concat(AX.map(m => ({l:m.l, a:A[m.k], b:B[m.k], hi:m.hi, fa:m.s3?sv3(A[m.k]):num(A[m.k],m.d), fb:m.s3?sv3(B[m.k]):num(B[m.k],m.d)})));
  $('#h2hTeams').innerHTML = h + cmpTable(rows) + '</div></div>';
}

/* ---------- player head-to-head ---------- */
const PM_S = [
  {k:'gpg', l:'Goals / GP', hi:1, d:2}, {k:'apg', l:'Assists / GP', hi:1, d:2}, {k:'pgp', l:'Points / GP', hi:1, d:2},
  {k:'sogpg', l:'Shots / GP', hi:1, d:1}, {k:'pmpg', l:'+/- / GP', hi:1, d:2, sg:1}, {k:'shp', l:'Shooting %', hi:1, d:1}
];
const PM_G = [
  {k:'svPct', l:'Save %', hi:1, d:3, s3:1}, {k:'gaa', l:'GAA', hi:0, d:2}, {k:'wpct', l:'Win %', hi:1, d:3, s3:1},
  {k:'sapg', l:'Shots faced / GP', hi:1, d:1}, {k:'so', l:'Shutouts', hi:1, d:0}
];
function poolFor(g){
  if(g==='G') return GL.filter(p=>p.gp>=Math.min(MIN_GL,3)||p.gp>0);
  return SK.filter(p => (g==='F' ? p.pos!=='D' : p.pos==='D') && p.gp>0);
}
function renderH2HPlayers(){
  const g = state.pg, pool = poolFor(g), metrics = g==='G' ? PM_G : PM_S;
  const ordered = pool.filter(p=>inV(p.team)).sort((a,b) => g==='G' ? b.gp-a.gp : b.p-a.p);
  const byId = id => pool.find(p=>String(p.id)===String(id));
  if(!byId(state.pA)) state.pA = ordered[0] ? ordered[0].id : null;
  if(!byId(state.pB) || state.pB===state.pA) state.pB = ordered[1] ? ordered[1].id : null;
  const A = byId(state.pA), B = byId(state.pB);
  const opts = sel => DIVS.map(d => {
    const ps = pool.filter(p=>T[p.team].division===d).sort((x,y)=> g==='G' ? y.gp-x.gp : y.p-x.p).slice(0,g==='G'?16:40);
    return '<optgroup label="'+d+'">'+ps.map(p=>'<option value="'+p.id+'"'+(String(p.id)===String(sel)?' selected':'')+'>'+esc(p.name)+' ('+p.team+', '+(p.pos?esc(p.pos):'G')+')</option>').join('')+'</optgroup>';
  }).join('');
  let h = '<div class="sh"><h2>Head-to-head: players</h2></div>'
    + pillRow([['F','Forwards'],['D','Defensemen'],['G','Goalies']], g, 'data-pg') + '<div class="h2h">';
  if(!A || !B){ $('#h2hPlayers').innerHTML = h+'<div class="panel empty">'+(pool.length?'Not enough players to compare yet.':'Player stats are not loaded yet. Run <code>python fetch_nhl.py</code> to add them.')+'</div></div>'; return; }
  const q = pool.filter(p => g==='G' ? p.gp>=Math.min(MIN_GL,3) : p.gp>=MIN_SK);
  const base = q.length>2 ? q : pool;
  const rng = {}; metrics.forEach(m => { const xs = base.map(p=>p[m.k]); rng[m.k]=[Math.min.apply(null,xs),Math.max.apply(null,xs)]; });
  const nrm = (m,val) => { const r=rng[m.k]; if(r[1]===r[0]) return 0.5; const f=Math.max(0,Math.min(1,(val-r[0])/(r[1]-r[0]))); return 0.06+0.94*(m.hi?f:1-f); };
  const fm = (m,p) => m.s3 ? sv3(p[m.k]) : (m.sg ? (p[m.k]>0?'+':'')+num(p[m.k],m.d) : num(p[m.k],m.d));
  h += '<div class="panel"><div class="sel"><select class="ca" data-sel="pA" aria-label="Player A">'+opts(state.pA)+'</select><select class="cb" data-sel="pB" aria-label="Player B">'+opts(state.pB)+'</select></div>'
    + radar(metrics.map(m=>m.l), metrics.map(m=>nrm(m,A[m.k])), metrics.map(m=>nrm(m,B[m.k])), metrics.map(m=>[lastName(A.name), m.l, fm(m,A)]), metrics.map(m=>[lastName(B.name), m.l, fm(m,B)])) + '</div>';
  const rows = [{l:'Team', a:0, b:0, hi:1, fa:esc(A.team), fb:esc(B.team)}, {l:'Games', a:A.gp, b:B.gp, hi:1, fa:A.gp, fb:B.gp}]
    .concat(g==='G' ? [{l:'Record', a:A.w, b:B.w, hi:1, fa:A.w+'-'+A.l+'-'+A.otl, fb:B.w+'-'+B.l+'-'+B.otl}] : [{l:'G-A-P', a:A.p, b:B.p, hi:1, fa:A.g+'-'+A.a+'-'+A.p, fb:B.g+'-'+B.a+'-'+B.p}])
    .concat(metrics.map(m => ({l:m.l, a:A[m.k], b:B[m.k], hi:m.hi, fa:fm(m,A), fb:fm(m,B)})));
  h += '<div class="panel"><h3><span style="color:var(--a)">'+esc(A.name)+'</span> vs <span style="color:var(--b)">'+esc(B.name)+'</span></h3>'+cmpTable(rows)+'</div></div>';
  $('#h2hPlayers').innerHTML = h;
}

/* ---------- hover tooltips: chart points and column headers ---------- */
const DESC = {
  common: {
    'Team':'Team', 'Div':'Division', 'GP':'Games played', 'W':'Wins', 'L':'Regulation losses',
    'OTL':'Overtime and shootout losses (worth 1 point)', 'PTS':'Standings points: 2 per win, 1 per overtime or shootout loss',
    'PPR':'Possible points remaining: 2 for every game left in the 84-game season', 'P%':'Points percentage: points earned divided by points possible so far',
    'RW':'Regulation wins', 'GF':'Goals for', 'GA':'Goals against', 'DIFF':'Goal differential: goals for minus goals against',
    'L10':'Record in the last 10 games (W-L-OTL)', 'STRK':'Current streak (W = wins, L = losses, OT = overtime losses)',
    'Last game':'Result of the most recent game', 'Next game':'Next scheduled game', '#':'Rank'
  },
  form: {
    'Last 5':'Last five games, oldest to most recent. Green is a win, gray an overtime loss, red a loss.',
    'Home':'Record in home games (W-L-OTL)', 'Road':'Record in road games (W-L-OTL)',
    'One-goal games':'Record in games decided by one goal (W-L-OTL)', 'Overtime games':'Record in games that went to overtime or a shootout (W-L-OTL)',
    'Division games':'Record against division rivals (W-L-OTL)'
  },
  race: {
    'Playoff spot':'Where the team would land if the season ended today: top 3 in each division, then 2 wild cards per conference',
    'Points pace':'Points per game times 84: where the team would finish at its current rate'
  },
  scorers: {
    'Points leader':"The team's top scorer by points", 'P':'Points (goals plus assists)', 'Goals leader':"The team's top goal scorer",
    'G':'Goals', 'Share of team goals':"Top goal scorer's share of all goals by the team's skaters"
  },
  dvd: {
    'Division':'Division', 'All other divisions':'Record against every other division (W-L-OTL), with goal differential and points %'
  },
  shots: {
    'Shots for / GP':'Shots on goal per game', 'Shots against / GP':'Shots on goal allowed per game',
    'Shot share':"Share of all shots in the team's games taken by the team. Above 50% means it controls play more often.",
    'Shooting %':'Goals divided by shots on goal', 'Save %':'Saves divided by shots faced',
    'PDO':'Shooting % plus save %, times 1,000. Around 1,000 is normal; far above or below usually evens out.'
  },
  sched: {
    'Games':'Games left on the schedule', 'Home':'Home games left', 'Road':'Road games left',
    'Back-to-backs':"Games played the day after the team's previous game",
    "Opponents' points %":'Average points % of upcoming opponents (only opponents who have played)'
  },
  xg: {
    'xGF':"Expected goals for: what an average shooter would score from the team's shots",
    'xGA':"Expected goals against: what an average shooter would score from opponents' shots",
    'xG share':"Team's share of the expected goals in its games",
    'Goals vs. xG':'Goals scored minus expected goals. Positive means finishing better than expected.',
    'Goals against vs. xG':'Goals allowed minus expected goals against. Negative means goaltending better than expected.'
  },
  skaters: {
    'Player':'Player', 'Pos':'Position (C center, L left wing, R right wing, D defense)', 'G':'Goals', 'A':'Assists', 'P':'Points (goals plus assists)',
    '+/-':'Plus/minus: even-strength goals for minus goals against while on the ice', 'PIM':'Penalty minutes', 'PPG':'Power-play goals',
    'SOG':'Shots on goal', 'S%':'Shooting percentage: goals divided by shots on goal', 'TOI':'Average ice time per game (min:sec)',
    'HIT':'Hits', 'FO%':'Faceoff win percentage', 'P/GP':'Points per game'
  },
  goalies: {
    'Goalie':'Goalie', 'W':'Wins', 'L':'Regulation losses', 'OTL':'Overtime and shootout losses', 'SA':'Shots against', 'SV':'Saves',
    'GA':'Goals against', 'SV%':'Save percentage: saves divided by shots against', 'GAA':'Goals-against average per 60 minutes',
    'SO':'Shutouts', 'TOI':'Time on ice'
  }
};
function colDesc(el, key){
  const sec = el.closest('section'), id = sec ? sec.id : '';
  const ctx = id==='insights' ? state.ins : id==='playerLeaders' ? 'skaters' : id==='goalieLeaders' ? 'goalies' : 'standings';
  const m = DESC[ctx] || {};
  if(m[key]) return m[key];
  if(ctx==='race' && /^Points pace/.test(key)) return m['Points pace'];
  if(ctx==='dvd' && /^vs /.test(key)) return 'Record against the '+key.slice(3)+' division (W-L-OTL), with goal differential';
  return DESC.common[key] || '';
}
const tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
function moveTip(x,y){ const r = tip.getBoundingClientRect(); let L = x+14, Tp = y-r.height-12;
  if(L+r.width > innerWidth-8) L = x-r.width-14; if(Tp < 8) Tp = y+18; tip.style.left = L+'px'; tip.style.top = Tp+'px'; }
let tipFor = null;
const TIPSEL = '.rpt, th, .chd .v';
function tipContent(g){
  if(g.classList.contains('rpt')){
    const lines = g.dataset.l ? g.dataset.l.split('||').map(x => x.split('::')) : [[g.dataset.m, g.dataset.v]];
    return {html:'<b>'+esc(g.dataset.n)+'</b>'+lines.map(l => '<span>'+esc(l[0])+': <b>'+esc(l[1])+'</b></span>').join(''), c:g.dataset.c, wrap:false};
  }
  const key = ((g.childNodes[0] && g.childNodes[0].textContent) || '').trim(), d = colDesc(g, key);
  if(!d || d===key) return null;
  return {html:'<b>'+esc(key)+'</b><span>'+esc(d)+'</span>', c:'var(--div)', wrap:true};
}
function hideTip(){ tip.classList.remove('on'); tipFor = null; }
function showTip(g, e){
  if(tipFor !== g){ const t = tipContent(g); if(!t){ hideTip(); return; }
    tipFor = g; tip.innerHTML = t.html; tip.style.borderLeftColor = t.c; tip.classList.toggle('wrap', t.wrap); }
  tip.classList.add('on'); moveTip(e.clientX, e.clientY);
}
document.addEventListener('pointerover', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g) showTip(g, e); });
document.addEventListener('pointermove', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g) showTip(g, e); });
document.addEventListener('pointerout', e => { const g = e.target.closest && e.target.closest(TIPSEL); if(g && !(e.relatedTarget && g.contains(e.relatedTarget))) hideTip(); });
addEventListener('scroll', hideTip, {passive:true});

/* ---------- wiring ---------- */
function renderAll(){
  renderTabs(); renderHero(); renderStandings(); renderDivCharts(); renderInsights(); renderTeamLeaders();
  renderPlayerLeaders(); renderGoalieLeaders(); renderH2HTeams(); renderH2HPlayers();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-div],[data-sort],[data-skm],[data-skp],[data-glm],[data-pg],[data-ins]');
  if(!t) return;
  if(t.dataset.div){ state.div = t.dataset.div; state.tA = state.tB = null; state.pA = state.pB = null; renderAll(); }
  else if(t.dataset.sort){ const k=t.dataset.sort; if(state.sortKey===k) state.sortDir*=-1; else { state.sortKey=k; state.sortDir = k==='team'?1:-1; } renderStandings(); }
  else if(t.dataset.ins){ state.ins = t.dataset.ins; renderInsights(); }
  else if(t.dataset.skm){ state.skm = t.dataset.skm; renderPlayerLeaders(); }
  else if(t.dataset.skp){ state.skp = t.dataset.skp; renderPlayerLeaders(); }
  else if(t.dataset.glm){ state.glm = t.dataset.glm; renderGoalieLeaders(); }
  else if(t.dataset.pg){ state.pg = t.dataset.pg; state.pA = state.pB = null; renderH2HPlayers(); }
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-sel]');
  if(!s) return;
  const k = s.dataset.sel;
  state[k] = s.value;
  if(k==='tA' || k==='tB'){ if(state.tA===state.tB){ const o = k==='tA'?'tB':'tA'; state[o] = AB.find(a=>a!==state[k]); } renderH2HTeams(); }
  else { renderH2HPlayers(); }
});

const fTS = s => new Date(s).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
$('#asof').textContent = D.seasonLabel + ' season \u00b7 Updated as of: ' + (D.updatedAt ? fTS(D.updatedAt) : fD(D.asOf));
const SHELL = !D.sample && !games.length && !AB.some(a=>T[a].gp>0);
if(D.note) $('#banner').innerHTML = '<div class="banner">'+esc(D.note)+'</div>';
else if(D.sample) $('#banner').innerHTML = '<div class="banner"><b>Sample data.</b> Results, standings, and players here are simulated so you can try every feature.</div>';
else if(SHELL) $('#banner').innerHTML = '<div class="banner"><b>No game data yet.</b> This is the '+esc(D.seasonLabel)+' season shell: teams and divisions only. Run <code>python fetch_nhl.py</code> to pull the current season\'s standings, schedule, and player stats.</div>';
$('#foot').innerHTML = D.note ? 'Standings, scores, and schedule from the NHL public API (api-web.nhle.com), current regular season only. Snapshot taken '+esc(D.generated||D.asOf)+'.' : D.sample ? 'Simulated sample season for layout testing. Not real NHL results.' : (SHELL ? 'No data pulled yet for the '+esc(D.seasonLabel)+' season.' : 'Data from the NHL public API (api-web.nhle.com and api.nhle.com), current regular season only. Snapshot taken '+esc(D.generated||D.asOf)+'.');
renderAll();
})();
</script>
